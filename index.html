<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Quiz</title>
<style>
:root{
  --bg:#f6f5f1;--surface:#fff;--ink:#1d1d1b;--muted:#6b6a64;--line:#e3e1d9;
  --accent:#1f6f5c;--accent-ink:#fff;--accent-soft:#e3f1ec;--ok:#2e7d32;--bad:#c62828;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171715;--surface:#222220;--ink:#f0eee7;--muted:#a19f95;--line:#363631;
  --accent:#5cc4a8;--accent-ink:#0f1f1a;--accent-soft:#1f3a32;--ok:#7bd17f;--bad:#ff8a80;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px 8px;max-width:1100px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer}
nav button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
main{max-width:1100px;margin:0 auto;padding:8px 20px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 18px}
input[type=text],input[type=search],select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar input[type=search]{flex:1 1 220px}
.btn{font:inherit;font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.photo{aspect-ratio:1/1;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:42px;font-weight:600;width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:10px 12px 12px}
.name{font-weight:600;line-height:1.25}
.role{font-size:14px;color:var(--muted)}
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}.nick{font-size:14px;font-style:italic;color:var(--accent)}
.team{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px}
.pending{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:18px}.pending h3{margin:0 0 4px;font-size:16px}
.cardact{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}.cardact .btn{font-size:13px;padding:6px 10px;flex:1 1 auto}
.edit{position:absolute;top:8px;right:8px;font-size:12px;padding:4px 9px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.me{position:absolute;top:8px;left:8px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.empty,.note{color:var(--muted);text-align:center;padding:40px 10px}
.note.box{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:left;margin-bottom:14px;font-size:14px}
.count{color:var(--muted);font-size:14px;margin-left:auto}
.home{max-width:560px;margin:4vh auto 0}
.hero h2{font-size:28px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:0 0 20px}
.create{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.create label{font-weight:600}
.create input{width:100%}
.mine{margin-top:26px}.mine h3{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 8px}
.minelink{display:inline-block;color:var(--accent);text-decoration:none;margin:0 14px 6px 0;font-weight:500}
.minelink:hover{text-decoration:underline}
.linkrow{display:flex;gap:8px;margin:8px 0}.linkrow input{flex:1}
nav[hidden]{display:none}
.authbar{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted)}.btn.small{font-size:13px;padding:5px 10px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:10}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:420px;margin-top:4vh}
.modal h2{margin:0 0 14px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input[type=text]{width:100%}
.pic{display:flex;gap:14px;align-items:center}
.pic .photo{width:96px;height:96px;border-radius:50%;overflow:hidden;font-size:32px;flex:none}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;min-height:20px}
/* game */
.game{max-width:560px;margin:0 auto;padding-bottom:120px}
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.modes .btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.prog{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.q>.photo{width:min(173px,46vw);height:min(173px,46vw);border-radius:16px;margin:0 auto 10px;overflow:hidden}
.q h2{margin:0 0 10px;font-size:20px}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.opts.one{grid-template-columns:1fr}
.opt small{display:block;font-size:12px;color:var(--muted);font-style:italic}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}.checks label{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink);margin:0}
.checks.col{flex-direction:column;gap:6px}.companel{margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.checks input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.opt{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer;min-height:48px}
.opt.pic{padding:0;overflow:hidden;aspect-ratio:1/1}
.opt.pic .photo{width:100%;height:100%;margin:0;border-radius:0;font-size:28px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.fb{min-height:48px;margin-top:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.fb>.btn{min-width:60%}
.fb{scroll-margin-bottom:110px}
.choicecol{display:flex;flex-direction:column;gap:6px;margin-top:6px}.choicerow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;margin-top:6px}
.choicecol .btn,.choicerow .btn{text-align:left}.choicerow .btn{flex:1 1 auto;text-align:center}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.steplabel{text-align:left;font-weight:700;font-size:15px;margin:4px 0 8px}
.levels{display:flex;flex-direction:column;gap:10px}
.level{--lv:#2e8b57;--lvbg:#e6f4ec;position:relative;display:grid;grid-template-columns:1fr auto;grid-template-areas:"tag check" "title check" "desc check";text-align:left;gap:2px 10px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.level.mid{--lv:#c77700;--lvbg:#fdf0dc}.level.hard{--lv:#c0392b;--lvbg:#fbe5e2}
.lvtag{grid-area:tag;justify-self:start;background:var(--lv);color:#fff;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 9px;border-radius:999px}
.lvtitle{grid-area:title;font-size:18px;font-weight:700;margin-top:4px}.lvdesc{grid-area:desc;font-size:14px;color:var(--muted)}
.lvcheck{grid-area:check;align-self:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.level[aria-checked=true]{border-color:var(--lv);background:var(--lvbg);box-shadow:0 0 0 3px color-mix(in srgb,var(--lv) 25%,transparent)}
.level[aria-checked=true] .lvcheck{background:var(--lv);border-color:var(--lv)}
@media (prefers-color-scheme:dark){.level{--lvbg:color-mix(in srgb,var(--lv) 18%,var(--surface))}.level.mid,.level.hard{--lvbg:color-mix(in srgb,var(--lv) 18%,var(--surface))}}
.savebox{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.savebox.col{flex-direction:column;align-items:stretch}
.lb{display:grid;grid-template-columns:36px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.lb .pos{font-size:20px;text-align:center}.lb .pct{font-weight:700;color:var(--accent)}
.okt{color:var(--ok)}.badt{color:var(--bad)}
.reveal{background:var(--accent-soft);border-radius:12px;padding:12px;width:100%;text-align:center}
.photo.small{width:64px;height:64px;border-radius:12px;overflow:hidden;margin:0 auto 6px;font-size:22px}
.hardform{text-align:left;max-width:360px;margin:0 auto}
.hardform .field input[type=text]{width:100%}
.review{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.rv{display:grid;grid-template-columns:96px 1fr auto;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:14px;align-items:start}
.rv .rl{color:var(--muted)}.rv .ans{color:var(--ok);font-weight:600}.rv .rp{font-weight:700;white-space:nowrap}
.rv.ok{border-color:var(--ok)}.rv.ok .rp{color:var(--ok)}.rv.near{border-color:#d9a400}.rv.near .rp{color:#b98600}.rv.bad{border-color:var(--bad)}.rv.bad .rp{color:var(--bad)}
.final{font-size:44px;font-weight:700;margin:10px 0}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--accent);text-decoration:underline;cursor:pointer;align-self:flex-start}.linkbtn[disabled]{opacity:.6;cursor:default}
.privacy p{margin:0 0 10px;font-size:15px}
.team.f1{background:color-mix(in srgb,#d9a400 22%,var(--surface));color:var(--ink)}
.team.f2{background:color-mix(in srgb,#5b7fd9 22%,var(--surface));color:var(--ink)}
.ftext{margin-top:4px}.modal.wide{max-width:560px}
.sedwrap summary{cursor:pointer;font-weight:600}.sed{margin-top:6px}
.sedfield{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.sedhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sedhead input[type=text]{flex:1 1 150px}
.sedopts{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.sedopt{display:flex;gap:4px;align-items:center}.sedopt input[type=text]{flex:1 1 auto}
.sedsubs{margin:4px 0 6px 18px;padding-left:10px;border-left:3px solid var(--accent);display:flex;flex-direction:column;gap:6px}
.ib{padding:5px 9px;white-space:nowrap}
details.sedwrap{border-top:1px solid var(--line);padding-top:10px}
.clubhome{max-width:520px;margin:8px auto 0}
.playnow{display:block;width:100%;font-size:24px;font-weight:700;padding:22px 16px;border-radius:16px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{font:inherit;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.tile:active{transform:scale(.98)}.tile .ti{font-size:26px;line-height:1}
.pagehead{display:flex;align-items:center;gap:10px;margin:0 0 12px}.pagehead h2{margin:0;font-size:20px}
.adminbox{margin-top:22px}.adminrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sharebtn{width:100%;margin:6px 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:13px}
.legend{position:relative;border:3px solid transparent !important;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#8a6d0b,#f7d774 25%,#b8860b 50%,#fff1a8 70%,#9c7a12) border-box !important;box-shadow:0 0 0 1px rgba(138,109,11,.35),0 0 16px rgba(240,190,40,.45) !important}
.photo.legend{background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box,linear-gradient(135deg,#8a6d0b,#f7d774 25%,#b8860b 50%,#fff1a8 70%,#9c7a12) border-box !important}
.card.legend{overflow:hidden}
.spk{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-50%) scale(.2);opacity:0;background:radial-gradient(circle,#fff 0 18%,#ffe680 40%,#e0a800 75%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 2px #b8860b);animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}45%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(45deg)}60%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.spk{animation:none;opacity:.85;transform:translate(-50%,-50%) scale(.8)}}
.legendbadge{position:absolute;top:8px;left:8px;z-index:3;background:linear-gradient(135deg,#b8860b,#f7d774);color:#3b2c00;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.legendnote{font-size:13px;font-style:italic;color:#9c7a12;margin-top:2px}
@media (prefers-color-scheme:dark){.legendnote{color:#f0c94a}}
.legendmsg{font-weight:700;color:#9c7a12;margin-bottom:6px}
@media (prefers-color-scheme:dark){.legendmsg{color:#f0c94a}}
.checkline,.field label.checkline{display:flex;align-items:flex-start;gap:8px;font-weight:600;cursor:pointer}.checkline input{margin-top:3px}
.field.missing{outline:2px solid var(--bad);outline-offset:4px;border-radius:8px}
.collect{text-align:center;margin:4px 0 16px}.collect h2{margin:6px 0}
.switch{display:flex;align-items:center;gap:10px;margin:10px 0 4px;font-size:15px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:21px}
</style>
</head>
<body>
<header>
  <h1><span id="title">Club Quiz</span> <small id="sub"></small></h1>
  <div id="auth" class="authbar"></div>
</header>
<main id="main"></main>
<div id="modal"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ" crossorigin="anonymous"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? (k.startsWith("aria-") ? "true" : "") : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const initials = n => (n||"?").trim().split(/\s+/).slice(0,2).map(s=>s[0]||"").join("").toUpperCase();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const arr = v => Array.isArray(v) ? v : [];
const fullLabel = p => (p.name||"—") + (p.nick ? " «" + p.nick + "»" : "");
/* ---------- struttura della scheda (la definisce l'admin di ogni directory) ---------- */
const FIELD_TYPES = [{id:"text",label:"Testo libero"},{id:"single",label:"Scelta singola"},{id:"multi",label:"Scelta multipla"}];
const MAX_FIELDS = 8;
const rid = p => p + Math.random().toString(36).slice(2, 8).padEnd(6, "0");
const TEMPLATES = [
  {id:"azienda", label:"Azienda", useNick:true, fields:[
    {id:"reparto",label:"Reparto",type:"single",options:["Direzione","Amministrazione","Vendite","Marketing","Produzione","IT","Risorse umane"].map((l,i)=>({id:"d_"+i,label:l}))},
    {id:"ruolo",label:"Ruolo",type:"text"},
    {id:"sede",label:"Sede",type:"text"}]},
  {id:"sci", label:"Sci club", useNick:true, fields:[
    {id:"ruolo",label:"Ruolo",type:"multi",options:[
      {id:"aiuto",label:"Aiutomonitore"},{id:"monitore",label:"Monitore"},
      {id:"comitato",label:"Comitato",sub:[["c_pres","Presidente"],["c_vice","Vice Presidente"],["c_coach","Team Coach"],["c_segr","Segretaria"],["c_cass","Cassiere"],["c_eventi","Responsabile Eventi"],["c_sito","Responsabile Sito/Area soci"],["c_pr","Responsabile PR"],["c_inv","Responsabile attività invernali"],["c_membro","Membro di comitato"]].map(([id,label])=>({id,label}))}]},
    {id:"attrezzo",label:"Attrezzo",type:"multi",options:[{id:"sci",label:"Sci"},{id:"snow",label:"Snowboard"}]}]},
  {id:"vuoto", label:"Vuoto", useNick:false, fields:[]}
];
const fieldsOf = () => (state.company && state.company.fields) || [];
const hasSub = o => arr(o.sub).length > 0;
const textOf = (f, p) => f.type==="text" ? String((p.data||{})[f.id]||"").trim() : "";
// Etichette da mostrare per un campo a scelta: prima i dettagli scelti (es. la carica), poi la scelta che ha dettagli ma senza dettaglio scelto, poi le altre.
// Etichette da mostrare per un campo a scelta. Con «detail» restituisce {label, sub} (sub = dettaglio scelto, es. la carica).
function chipLabels(f, p, detail){
  if (f.type==="text") return [];
  const ids = arr((p.data||{})[f.id]);
  const out = [];
  const yesNo = l => /^s[iì]$/i.test(l.trim()) ? f.label : l;
  for (const o of arr(f.options)){
    if (!ids.includes(o.id)) continue;
    const picked = hasSub(o) ? o.sub.filter(s => ids.includes(s.id)) : [];
    if (picked.length) picked.forEach(s => out.push({label:s.label, sub:true}));
    else if (/^no$/i.test(o.label.trim())) continue;
    else out.push({label:yesNo(o.label), sub:false});
  }
  return detail ? out : out.map(x => x.label);
}
function searchText(p){ return [p.name, p.nick, ...fieldsOf().flatMap(f => [textOf(f,p), ...chipLabels(f,p)])].join(" ").toLowerCase(); }
function detailBits(p){
  const fs = fieldsOf();
  return {
    chips: (() => {                       // prima i dettagli (es. la carica), poi il resto, nell'ordine dei campi
      const all = fs.flatMap((f,i) => chipLabels(f,p,true).map(x => Object.assign({i}, x)));
      return [...all.filter(x => x.sub), ...all.filter(x => !x.sub)].map(x => h("span",{class:"team f"+(x.i%3)}, x.label));
    })(),
    texts: fs.filter(f => textOf(f,p)).map(f => h("div",{class:"role ftext"}, f.label + ": " + textOf(f,p)))
  };
}
// Controlli per compilare un campo (usato dal modulo e dal gioco «Super Hard»)
function fieldInput(f, initial){
  if (f.type==="text"){
    const inp = h("input",{type:"text",maxlength:"100",value:typeof initial==="string"?initial:"",autocomplete:"off","aria-label":f.label});
    return {el:inp, controls:[inp], get:()=>inp.value.trim(), main:inp};
  }
  const ids = arr(initial), single = f.type==="single", gname = rid("g");
  const entries = f.options.map(o => {
    const box = h("input",{type:single?"radio":"checkbox",name:single?gname:null,value:o.id,checked:ids.includes(o.id)});
    const subBoxes = arr(o.sub).map(s => h("input",{type:"checkbox",value:s.id,checked:ids.includes(s.id)}));
    const panel = subBoxes.length ? h("div",{class:"companel",style:"display:none"},
      h("div",{class:"role",style:"margin-bottom:4px"}, "Per «" + o.label + "»" + (subBoxes.length > 1 ? " (Più risposte possibili)" : "")),
      h("div",{class:"checks col"}, o.sub.map((s,i) => h("label",{}, subBoxes[i], s.label)))) : null;
    return {o, box, subBoxes, panel};
  });
  const sync = () => entries.forEach(e => { if (e.panel) e.panel.style.display = e.box.checked ? "block" : "none"; });
  entries.forEach(e => e.box.addEventListener("change", sync));
  sync();
  return {
    el: h("div",{}, h("div",{class:"checks"}, entries.map(e => h("label",{}, e.box, e.o.label))), entries.map(e => e.panel)),
    controls: entries.flatMap(e => [e.box, ...e.subBoxes]),
    get: () => entries.flatMap(e => e.box.checked ? [e.o.id, ...e.subBoxes.filter(b => b.checked).map(b => b.value)] : []),
    // Messaggio se manca una risposta (scelta, o dettaglio della scelta), altrimenti null
    missing: () => {

      return e ? "«" + f.label + "» → «" + e.o.label + "»: scegli anche un'opzione dall'elenco." : null;
    }
  };
}

function slugify(name){
  const base = name.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,30).replace(/-+$/,"") || "gruppo";
  const abc = "abcdefghijklmnopqrstuvwxyz0123456789";
  const rnd = Array.from(crypto.getRandomValues(new Uint8Array(5)), b => abc[b % 36]).join("");
  return base + "-" + rnd;
}

async function loadPeople(){

    if (error) throw error; rows = data || [];

const SUBPAGES = { gioca:"game", classifica:"board", album:"dir", elenco:"dir" };
const PAGE_OF = { game:"gioca", board:"classifica", dir:"album" };
let lastHash = location.hash;
function navTo(view){ location.hash = state.slug + (PAGE_OF[view] ? "/" + PAGE_OF[view] : ""); }
async function route(){
  let raw = location.hash.replace(/^#/, "");
  if (/(^|&)(access_token|error|type)=/.test(raw)){ history.replaceState(null, "", location.pathname); raw = ""; }
  const [slug, sub] = raw.split("/");
  const view = SUBPAGES[sub] || "home";
  // Partita in corso e si sta uscendo (tasto indietro del telefono o link): chiedi conferma
  if (state.view==="game" && game.inProgress() && !(slug===state.slug && view==="game")){
    const back = lastHash;
    confirmLeave(() => { lastHash = location.hash; route(); }, () => { history.pushState(null, "", location.pathname + back); });
    return;
  }
  lastHash = location.hash;
  // Stessa directory: cambia solo pagina, senza ricaricare i dati
  if (slug && state.company && slug===state.slug){
    if (view!=="home" && !gameOpen()){ history.replaceState(null, "", location.pathname + "#" + slug); lastHash = location.hash; state.view = "home"; render(); return; }
    if (view==="game" && state.view!=="game") game.reset();
    state.view = view; render(); window.scrollTo(0, 0);
    return;
  }
  const my = ++routeToken;
  Object.assign(state, {people:[], q:"", notFound:false, company:null, admin:false, loaded:false, view, slug:null});
  game.reset();
  if (state.configMissing){ render(); return; }
  if (!slug){ state.loaded = true; render(); return; }
  if (!SLUG_RE.test(slug)){ state.notFound = true; state.loaded = true; render(); return; }
  state.slug = slug; render();
  try {
    const { data, error } = await sb.rpc("club_info", { p_slug: slug });
    if (my !== routeToken) return;
    const club = !error && data && data[0];
    if (!club){ state.slug = null; state.notFound = true; state.loaded = true; render(); return; }
    state.company = { id: club.id, name: club.name, fields: Array.isArray(club.fields) ? club.fields : [], useNick: club.use_nick !== false, gameOn: club.game_enabled !== false, members: club.members || 0 };
    if (state.session){
      const own = await sb.from("clubs").select("id").eq("slug", slug).maybeSingle();   // le regole di sicurezza restituiscono la riga solo al proprietario
      if (my !== routeToken) return;
      state.admin = !!(own && own.data);
    }
    if (view!=="home" && !gameOpen()){ history.replaceState(null, "", location.pathname + "#" + slug); lastHash = location.hash; state.view = "home"; }
    await loadPeople();
  } catch(e){
    if (my !== routeToken) return;
    state.loaded = true; state.company = state.company || null; state.loadError = true; render();
  }
}
async function initData(){
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || /INSERISCI/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY)){
    state.configMissing = true; state.loaded = true; render(); return;
  }
  // Rientro dal link «reimposta la password» ricevuto per email
  if (/type=recovery/.test(location.hash)) state.recovery = true;
  sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  sb.auth.onAuthStateChange((ev, sess) => {
    if (ev === "INITIAL_SESSION") return;
    if (ev === "PASSWORD_RECOVERY"){ state.session = sess; state.recovery = true; if (location.hash) history.replaceState(null, "", location.pathname); setTimeout(route, 0); return; }
    state.session = sess;
    setTimeout(route, 0);
  });
  route();
}

/* ---------- photo: crop to square + shrink so it fits in a doc ---------- */
async function fileToSquareJpeg(file, size=240){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Immagine non leggibile")); i.src=url; });
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - s)/2, sy = (img.naturalHeight - s)/2;
    const c = document.createElement("canvas"); c.width = c.height = size;
    c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, size, size);
    return c.toDataURL("image/jpeg", 0.82);
  } finally { URL.revokeObjectURL(url); }
}

        ib("↑", () => move(work.fields,i,-1), "Sposta il campo su", i===0), ib("↓", () => move(work.fields,i,1), "Sposta il campo giù", i===work.fields.length-1),
        ib("✕", () => { work.fields.splice(i,1); draw(); }, "Elimina il campo")));
    if (f.type!=="text"){
      const list = h("div",{class:"sedopts"}, arr(f.options).map((o,k) => optEd(f,o,k)));
      list.append(ib("＋ Scelta", () => { f.options.push({id:rid("o"),label:""}); draw(); }, "Aggiungi una scelta", arr(f.options).length>=30));
      card.append(list);
    }
    return card;
  }
  function draw(){
    root.replaceChildren();
    if (opts.templates){
      root.append(h("div",{class:"role"},"Modello di partenza"),
        h("div",{class:"choicerow",style:"margin-bottom:10px"}, TEMPLATES.map(t => h("button",{class:"btn small",type:"button",onclick:() => {
          work.fields = JSON.parse(JSON.stringify(t.fields)); work.useNick = t.useNick; draw();
        }}, t.label))));
    }
    const nick = h("input",{type:"checkbox",checked:work.useNick});
    nick.addEventListener("change", () => { work.useNick = nick.checked; });
    root.append(h("div",{class:"checks",style:"margin-bottom:10px"}, h("label",{}, nick, "Chiedi anche il soprannome")));
    work.fields.forEach((f,i) => root.append(fieldEd(f,i)));
    root.append(h("button",{class:"btn small",type:"button",disabled:work.fields.length>=MAX_FIELDS,onclick:() => { work.fields.push({id:rid("f"),label:"",type:"text"}); draw(); }},
      "＋ Aggiungi un campo" + (work.fields.length>=MAX_FIELDS ? " (massimo " + MAX_FIELDS + ")" : "")));
  }
  function get(){
    const out = [];
    for (const f of work.fields){
      const label = f.label.trim();
      if (!label) throw new Error("Dai un nome a ogni campo.");
      const nf = {id:f.id, label, type:f.type};
      if (f.type!=="text"){
        nf.options = [];
        for (const o of arr(f.options)){
          const ol = o.label.trim(); if (!ol) continue;
          const no = {id:o.id, label:ol};
          const subs = arr(o.sub).map(x => ({id:x.id, label:x.label.trim()})).filter(x => x.label);
          if (subs.length) no.sub = subs;
          nf.options.push(no);
        }
        if (!nf.options.length) throw new Error("«" + label + "»: aggiungi almeno una scelta.");
      }
      out.push(nf);
    }
    return {fields:out, useNick:work.useNick};
  }
  draw();
  return {el:root, get};
}

// Backup della directory in un file SQL, da rieseguire nello SQL Editor di Supabase dopo schema.sql
async function backupSql(){
  const cid = state.company.id;
  const [c, p, sc] = await Promise.all([
    sb.from("clubs").select("id,slug,name,fields,use_nick,created_at").eq("id", cid).maybeSingle(),
    sb.from("people").select("id,name,nick,data,photo,status,legend,legend_note,consent_at,created_at,updated_at").eq("club_id", cid).order("name"),
    sb.from("scores").select("id,player,mode,kind,n,score,max,seconds,created_at").eq("club_id", cid)]);
  for (const r of [c,p,sc]) if (r.error) throw r.error;
  const q = v => v == null ? "null" : "'" + String(v).replace(/'/g, "''") + "'";
  const j = v => q(JSON.stringify(v)) + "::jsonb";
  const email = (state.session && state.session.user && state.session.user.email) || "";
  const club = c.data, L = [];
  L.push("-- Club Quiz · backup della directory «" + club.name + "» · " + new Date().toLocaleString("it-CH"));
  L.push("-- " + p.data.length + " persone, " + sc.data.length + " punteggi.");
  L.push("-- RIPRISTINO: 1) esegui supabase/schema.sql  2) crea l'utente admin " + email + " (Authentication → Users → Add user)");
  L.push("--             3) esegui questo file nello SQL Editor. Le righe già presenti vengono saltate.");
  L.push("begin;");
  L.push("insert into public.clubs (id, slug, name, fields, use_nick, owner_id, created_at) values (" + [q(club.id), q(club.slug), q(club.name), j(club.fields), club.use_nick ? "true" : "false",
    "(select id from auth.users where lower(email) = lower(" + q(email) + "))", q(club.created_at)].join(", ") + ") on conflict (id) do nothing;");
  for (const r of p.data) L.push("insert into public.people (id, club_id, name, nick, data, photo, status, legend, legend_note, consent_at, created_at, updated_at) values (" +
    [q(r.id), q(club.id), q(r.name), q(r.nick), j(r.data), q(r.photo), q(r.status), r.legend ? "true" : "false", q(r.legend_note||""), q(r.consent_at), q(r.created_at), q(r.updated_at)].join(", ") + ") on conflict (id) do nothing;");
  for (const r of sc.data) L.push("insert into public.scores (id, club_id, player, mode, kind, n, score, max, seconds, created_at) values (" +
    [q(r.id), q(club.id), q(r.player), q(r.mode), q(r.kind), r.n, r.score, r.max, r.seconds, q(r.created_at)].join(", ") + ") on conflict (id) do nothing;");
  L.push("commit;");
  return L.join("\n") + "\n";
}
async function downloadBackup(btn){
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Preparo…";
  try {
    const sql = await backupSql();

    btn.textContent = old;
  } catch(e){ btn.textContent = "Backup non riuscito"; }
  btn.disabled = false;
}

const MODES = [
  {id:"name",  level:"Facile",     tag:"easy", label:"Nome → Foto",     desc:"Leggi un nome e trova la sua foto tra quattro.", min:4, rounds:10},
  {id:"photo", level:"Medio",      tag:"mid",  label:"Foto → Nome",     desc:"Vedi una foto e scegli il nome giusto tra quattro.", min:4, rounds:10},
  {id:"hard",  level:"Super Hard", tag:"hard", label:"Scheda completa", desc:"Vedi una foto e compila tutta la scheda: nome e informazioni.", min:1, rounds:5}
];
const fmt = n => String(Math.round(n*10)/10).replace(".", ",");
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for (let i=1;i<=m;i++){
    const cur = [i];
    for (let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const sortTok = s => s.split(" ").sort().join(" ");
// 1 = giusto, 0.5 = quasi (piccoli errori di scrittura), 0 = sbagliato. Maiuscole/accenti ignorati; ordine nome/cognome indifferente.
function judgeText(input, target){
  const t = norm(input), g = norm(target);
  if (!t) return 0;
  const d = Math.min(lev(t, g), lev(sortTok(t), sortTok(g)));
  if (d === 0) return 1;
  const lim = g.length <= 3 ? 0 : Math.min(3, Math.max(1, Math.floor(g.length * 0.2)));
  return d <= lim ? 0.5 : 0;
}
const mark = (pts, max) => pts >= max ? "ok" : pts > 0 ? "near" : "bad";
const markIcon = c => c==="ok" ? "✓" : c==="near" ? "≈" : "✗";

function infoLines(p){
  const d = detailBits(p);
  return h("div",{},
    d.chips.length ? h("div",{class:"chips",style:"justify-content:center"}, d.chips) : null, d.texts,

}
// Righe del punteggio «Super Hard» per un campo della scheda
// La scheda della persona contiene una risposta per questo campo?
function hasAnswer(f, t){
  if (f.type==="text") return !!textOf(f, t);
  const v = arr((t.data||{})[f.id]);
  return arr(f.options).some(o => v.includes(o.id));
}
function fieldRows(f, t, input){
  const rows = [];
  if (f.type==="text"){
    const want = textOf(f, t); if (!want) return rows;          // la persona non ha questo dato: nessuna domanda
    const got = input.get();
    rows.push({label:f.label, yours:got||"—", right:want, pts:judgeText(got, want), max:1});
    return rows;
  }
  const want = arr((t.data||{})[f.id]), got = input.get();
  if (f.type==="single"){
    const wo = f.options.find(o => want.includes(o.id)), go = f.options.find(o => got.includes(o.id));
    if (!wo) return rows;
    const ws = hasSub(wo) ? wo.sub.filter(x => want.includes(x.id)) : [];
    if (!ws.length){ rows.push({label:f.label, yours:go?go.label:"—", right:wo.label, pts:go===wo?1:0, max:1}); return rows; }
    rows.push({label:f.label, yours:go?go.label:"—", right:wo.label, pts:go===wo?0.5:0, max:0.5});
    const gs = go===wo ? wo.sub.filter(x => got.includes(x.id)) : [];
    const same = gs.length===ws.length && ws.every(x => gs.includes(x));
    rows.push({label:"↳ Dettaglio", yours:gs.map(x=>x.label).join(", ")||"—", right:ws.map(x=>x.label).join(", "), pts:same?0.5:0, max:0.5});
    return rows;
  }
  const lab = id => { for (const o of f.options){ if (o.id===id) return o.label; for (const s of arr(o.sub)) if (s.id===id) return s.label; } return id; };
  const plain = f.options.filter(o => !hasSub(o)), withSub = f.options.filter(hasSub);
  const wp = plain.filter(o => want.includes(o.id)).map(o => o.id), gp = plain.filter(o => got.includes(o.id)).map(o => o.id);
  if (wp.length || gp.length){                                  // scelte semplici: 1 punto se esatte
    const same = wp.length===gp.length && wp.every(x => gp.includes(x));
    rows.push({label:f.label, yours:gp.map(lab).join(", ")||"—", right:wp.map(lab).join(", ")||"nessuno", pts:same?1:0, max:1});
  }
  for (const o of withSub){                                     // scelte con dettagli: 0,5 + 0,5
    const w = want.includes(o.id), g = got.includes(o.id);
    if (!w && !g) continue;
    rows.push({label:o.label, yours:g?"Sì":"No", right:w?"Sì":"No", pts:(w && g) ? 0.5 : 0, max:0.5});
    const ws = o.sub.filter(x => want.includes(x.id)).map(x => x.id);
    if (w && ws.length){
      const gs = g ? o.sub.filter(x => got.includes(x.id)).map(x => x.id) : [];
      const same = gs.length===ws.length && ws.every(x => gs.includes(x));
      rows.push({label:"↳ " + o.label, yours:gs.map(lab).join(", ")||"—", right:ws.map(lab).join(", "), pts:same?0.5:0, max:0.5});
    }
  }
  return rows;
}
function revealCard(p, withPhoto){

const KINDS = [{id:"10",label:"10 domande"},{id:"20",label:"20 domande"},{id:"all",label:"Completo"}];
const kindLabel = k => k==="all" ? "Completo" : k + " domande";
const modeLabel = id => { const m = MODES.find(m=>m.id===id); return m ? m.level + " · " + m.label : id; };
const game = {
  mode:"name", kind:"10", phase:"setup", rounds:[], i:0, score:0, max:0, answered:false, t0:0, tEnd:0, saved:false,
  reset(){ this.phase="setup"; this.rounds=[]; this.i=0; this.score=0; this.max=0; this.answered=false; this.tEnd=0; this.saved=false; },
  inProgress(){ return this.phase==="play" && this.i < this.rounds.length && (this.i>0 || this.answered); },
  pool(){ return state.people.filter(p=>p.photo && p.name && p.approved !== false); },
  legendCap(kind){ return kind==="10" ? 1 : kind==="20" ? 2 : Infinity; },
  // Quante domande si possono fare con questo numero, rispettando il limite di Legend
  available(kind){ const pool = this.pool(), L = pool.filter(p=>p.legend).length; return pool.length - L + Math.min(L, this.legendCap(kind)); },
  start(){
    const pool = this.pool(), cap = this.legendCap(this.kind);
    const n = this.kind==="all" ? pool.length : Math.min(+this.kind, this.available(this.kind));
    const picks = []; let L = 0;                      // «Completo»: tutte le persone, in ordine casuale
    for (const p of shuffle(pool)){
      if (picks.length >= n) break;
      if (p.legend){ if (L >= cap) continue; L++; }
      picks.push(p);
    }
    this.rounds = picks.map(p => ({ target:p, options: shuffle([p, ...shuffle(pool.filter(x=>x.id!==p.id)).slice(0,3)]) }));
    this.i = 0; this.score = 0; this.max = 0; this.answered = false; this.tEnd = 0; this.saved = false;
    this.phase = "play"; this.t0 = Date.now();
  }
};

function confirmLeave(then, cancel){

  const modal = document.getElementById("modal"); const close = () => modal.replaceChildren();
  const stay = () => { close(); if (cancel) cancel(); };
  const yes = h("button",{class:"btn danger"},"Sì, esci"), no = h("button",{class:"btn primary"},"No, continua");
  yes.onclick = () => { close(); game.reset(); then(); }; no.onclick = stay;
  const ov = h("div",{class:"overlay"}, h("div",{class:"modal",role:"alertdialog","aria-modal":"true"},
    h("h2",{},"Uscire dalla partita?"),
    h("p",{},"La partita in corso andrà persa e il punteggio non verrà salvato in classifica."),
    h("div",{class:"actions"}, yes, no)));
  ov.addEventListener("mousedown", e => { if (e.target===ov) stay(); });
  modal.replaceChildren(ov); no.focus();
}

function gameView(){
  const wrap = h("div",{class:"game"});
  if (game.phase === "setup"){ setupView(wrap); return wrap; }
  if (game.i >= game.rounds.length){ endView(wrap); return wrap; }
  const r = game.rounds[game.i], t = r.target;
  const fb = h("div",{class:"fb"});
  const next = h("button",{class:"btn primary",onclick:()=>{game.i++;game.answered=false;render();}}, game.i+1<game.rounds.length ? "Avanti" : "Vedi il risultato");
  const mult = t.legend ? 2 : 1;
  let qPhoto = null, legendTargets = [];
  const legendMsg = () => t.legend ? h("div",{class:"legendmsg"}, "✨ Era una Legend! Punti doppi", t.legendNote ? h("div",{class:"role"}, t.legendNote) : null) : null;
  const finish = (pts, max, ...nodes) => {
    if (game.answered) return; game.answered = true; game.score += pts; game.max += max;
    if (t.legend) legendTargets.concat(qPhoto ? [qPhoto] : []).forEach(el => {
      legendize(el);
      if (!el.classList.contains("small")) el.append(legendBadge());   // etichetta «★ Legend» sulla foto, dopo la risposta
    });
    fb.replaceChildren(legendMsg() || "", ...nodes.filter(Boolean), next); next.focus();
    if (fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
  };
  let body;

  if (game.mode==="photo" || game.mode==="name"){
    const optEls = [];
    const opts = h("div",{class:"opts"});
    const answer = (p, el) => {
      if (game.answered) return;
      optEls.forEach(([q,e]) => { e.disabled = true; if (q.id===t.id) e.classList.add("ok"); else if (e===el) e.classList.add("bad"); });
      const ok = p.id===t.id;
      optEls.forEach(([q,e]) => { if (q.id===t.id && game.mode==="name") legendTargets.push(e); });
      const rc = revealCard(t, game.mode==="name");
      const small = rc.querySelector(".photo.small"); if (small) legendTargets.push(small);
      finish(ok ? mult : 0, mult, h("strong",{class:ok?"okt":"badt"}, ok ? (mult>1 ? "Esatto! +2" : "Esatto!") : "Era " + fullLabel(t)), rc);
    };
    for (const p of r.options){
      const el = game.mode==="photo"
        ? h("button",{class:"opt"}, p.name, p.nick ? h("small",{}, "«" + p.nick + "»") : null)
        : h("button",{class:"opt pic","aria-label":"Foto di una persona"}, photoEl(p));
      el.addEventListener("click", ()=>answer(p, el));
      optEls.push([p, el]); opts.append(el);
    }
    if (game.mode==="photo") qPhoto = photoEl(t);
    body = [game.mode==="photo" ? [qPhoto, h("h2",{},"Chi è?")] : h("h2",{}, "Seleziona la foto di " + t.name + "."), opts];

  } else { // hard: compila tutta la scheda
    const name = h("input",{type:"text",maxlength:"80",autocomplete:"off","aria-label":"Nome e cognome"});
    const useNick = !!(state.company && state.company.useNick);
    const nick = h("input",{type:"text",maxlength:"40",autocomplete:"off","aria-label":"Soprannome"});
    const fs = fieldsOf().filter(f => hasAnswer(f, t));      // si chiede solo ciò che la scheda della persona contiene
    const inputs = fs.map(f => fieldInput(f));
    const check = h("button",{class:"btn primary"},"Verifica la scheda");
    const need = h("div",{class:"err",role:"alert"});

    const submit = () => {
      if (game.answered) return;
      const miss = inputs.map(x => x.missing ? x.missing() : null);
      fieldBoxes.forEach((b,i) => b.classList.toggle("missing", !!miss[i]));
      const first = miss.find(Boolean);
      if (first){ need.textContent = first; const k = miss.findIndex(Boolean); if (fieldBoxes[k].scrollIntoView) fieldBoxes[k].scrollIntoView({block:"center",behavior:"smooth"}); return; }
      need.textContent = "";
      const rows = [];
      rows.push({label:"Nome e cognome", yours:name.value.trim()||"—", right:t.name, pts:judgeText(name.value, t.name), max:1});
      if (useNick && t.nick) rows.push({label:"Soprannome", yours:nick.value.trim()||"—", right:"«"+t.nick+"»", pts:judgeText(nick.value, t.nick), max:1});
      fs.forEach((f,i) => rows.push(...fieldRows(f, t, inputs[i])));
      [name, nick, ...inputs.flatMap(x => x.controls), check].forEach(el => el.disabled = true);
      const pts = rows.reduce((a,x)=>a+x.pts,0), max = rows.reduce((a,x)=>a+x.max,0);
      const table = h("div",{class:"review"}, rows.map(x => {
        const c = mark(x.pts, x.max);
        return h("div",{class:"rv " + c},
          h("div",{class:"rl"}, x.label),
          h("div",{class:"rt"}, c==="ok" ? x.right : [h("div",{}, "Tu: ", x.yours), h("div",{class:"ans"}, "Giusto: ", x.right)]),
          h("div",{class:"rp"}, markIcon(c) + " " + fmt(x.pts) + "/" + fmt(x.max)));
      }));
      finish(pts*mult, max*mult,
        h("strong",{class:mark(pts,max)==="ok"?"okt":""}, "Questa scheda: " + fmt(pts*mult) + " / " + fmt(max*mult) + (mult>1 ? " (punti doppi)" : "")),
        table,
        h("div",{class:"role",style:"margin-top:6px"},"Nome, soprannome e testi: 1 punto (0,5 se quasi giusto) · Scelte: 1 punto se esatte · Scelte con dettagli: 0,5 + 0,5 per il dettaglio"));
    };
    check.onclick = submit;
    name.addEventListener("keydown", e => { if (e.key==="Enter") submit(); });
    nick.addEventListener("keydown", e => { if (e.key==="Enter") submit(); });
    inputs.forEach(x => { if (x.main) x.main.addEventListener("keydown", e => { if (e.key==="Enter") submit(); }); });
    const fieldBoxes = fs.map((f,i) => h("div",{class:"field"}, fieldLabel(f), inputs[i].el));
    fieldBoxes.forEach(b => b.addEventListener("change", () => { b.classList.remove("missing"); need.textContent = ""; }));
    qPhoto = photoEl(t);
    body = [qPhoto, h("h2",{},"Compila la scheda di questa persona"),
      h("div",{class:"hardform"},
        h("div",{class:"field"}, h("label",{},"Nome e cognome"), name),
        useNick ? h("div",{class:"field"}, h("label",{},"Soprannome (se ne ha uno)"), nick) : null,
        fieldBoxes, need, check)];
  }
  wrap.append(
    h("div",{class:"prog"}, h("span",{},"Domanda " + (game.i+1) + " di " + game.rounds.length), h("span",{},"Punti: " + fmt(game.score))),
    h("div",{class:"q"}, body, fb));
  return wrap;
}

          if (!armed){ armed=true; del.textContent="Conferma"; setTimeout(()=>{armed=false;del.textContent="Elimina";},4000); return; }
          try { await deleteScores(r.player, board.mode, board.kind); load(); } catch(e){ del.textContent="Errore"; } }; }
        box.append(h("div",{class:"lb"},
          h("div",{class:"pos"}, i===0?"🥇":i===1?"🥈":i===2?"🥉":String(i+1)),
          h("div",{class:"who2"}, h("div",{class:"name"}, r.player), h("div",{class:"role"}, fmt(Number(r.score)) + " / " + fmt(Number(r.max)) + " · " + fmtTime(r.seconds) + (board.kind==="all" ? " · " + r.n + " pers." : ""))),
          h("div",{class:"pct"}, pct + "%"), del));
      });
    } catch(e){ box.replaceChildren(h("div",{class:"empty"},"Non riesco a caricare la classifica.")); }
  }
  selM.addEventListener("change", ()=>{ board.mode = selM.value; load(); });
  selK.addEventListener("change", ()=>{ board.kind = selK.value; load(); });
  load();
  return wrap;
}

render();
initData();
</script>
</body>
</html>
